name: corpus

# Measures how often each rule fires on human prose written before the
# generated web, and publishes the result. Report only: this workflow never
# fails the build on a rate change. The number is evidence for a human
# deciding which profile a rule belongs in, and a threshold would turn that
# judgment into a merge blocker without improving the judgment.
#
# Runs on release (the report is the artifact that dates a release), monthly
# (upstream sources move and pins can rot), and on demand.

# Triggered by the TAG PUSH rather than by `release: published`. A release
# created by release.yml is created with the default GITHUB_TOKEN, and GitHub
# deliberately does not raise workflow-triggering events for actions taken with
# that token. An `on: release` job here would never once have run, and the
# failure mode is silence: no run, no error, just a release with no report.
# The tag push comes from a person, so it triggers normally.
on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release upload, and the scheduled refresh branch
      pull-requests: write # the scheduled refresh PR
      # configure-pages with `enablement: true` turns Pages on via the REST
      # API on first run, and that call needs pages: write on THIS job. Without
      # it the step fails with a 403 and the site is never created — the exact
      # manual step the enablement flag exists to avoid.
      pages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Fetch corpus and measure
        # Corpus content is never committed. Sources are fetched at pinned
        # pre-cutoff revisions, so two runs a year apart measure the same text.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run corpus

      - name: Summary
        run: cat corpus/REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-report-${{ github.sha }}
          path: |
            corpus/REPORT.md
            corpus/report.json
            corpus/report.html
            corpus/corpus.lock.json
          retention-days: 90

      - name: Assemble the Pages site
        run: |
          mkdir -p _site
          cp corpus/report.html _site/index.html
          cp corpus/REPORT.md corpus/report.json corpus/corpus.lock.json _site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Attach the report to the release
        # Tag push and the release build race: release.yml is creating the
        # release from the same tag right now. Wait for it rather than
        # failing, and never fail the job over it — the report is already
        # uploaded as an artifact above, so a missed attach costs nothing.
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          for i in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" \
                corpus/REPORT.md corpus/report.json corpus/corpus.lock.json --clobber
              echo "attached the corpus report to $TAG"
              exit 0
            fi
            echo "waiting for release $TAG to exist ($i/30)"
            sleep 20
          done
          echo "release $TAG never appeared; the report is still in this run's artifacts"

      - name: Open a PR with the refreshed report
        # The in-repo REPORT.md is the copy GitHub renders and RULES.md cites,
        # and it only moves when someone commits it. Without this the monthly
        # run produced a number that evaporated into a 90-day artifact while
        # the published one drifted out of date.
        #
        # Opened as a DRAFT and never merged here. A PR raised with the default
        # GITHUB_TOKEN does not trigger other workflows, so CI will not run on
        # it. That is stated in the PR body so a missing green check is not
        # read as a failure.
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="corpus/refresh-$(date -u +%Y-%m)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add corpus/REPORT.md corpus/report.json corpus/corpus.lock.json
          # The report carries a generation date, so every run has a diff.
          # That is deliberate: a PR each month is evidence the harness ran,
          # where silence would equally mean it broke.
          git commit -m "corpus: refresh the measured report ($(date -u +%Y-%m-%d))"
          git push -u origin "$BRANCH" --force
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "PR already open for $BRANCH"
          else
            gh pr create --draft --base main --head "$BRANCH" \
              --title "corpus: refresh the measured report ($(date -u +%Y-%m))" \
              --body-file .github/corpus-refresh-pr-body.md
          fi

  deploy-pages:
    needs: report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
